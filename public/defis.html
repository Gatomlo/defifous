<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranch du Phoenix - Gestion des défis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f1f5f2; }
        .btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; font-size: 1.15rem; border: 1px solid #065f46; border-radius: 9999px; color: #a7f3d0; transition: background-color .15s; }
        .btn-icon:hover { background-color: rgba(6, 78, 59, .6); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

    <header class="bg-emerald-950 border-b border-emerald-900 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🌿</span>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-white tracking-wide">Ranch du Phoenix</h1>
                    <p class="text-xs text-emerald-300 font-medium tracking-wider uppercase">Gestion des défis</p>
                </div>
            </div>
            <a href="./" title="Accueil" aria-label="Accueil" class="btn-icon">🏠</a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8">
        <div class="flex justify-end mb-4">
            <button onclick="openForm()" class="px-5 py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl transition-colors">+ Nouveau défi</button>
        </div>
        <div id="challenges-list" class="grid grid-cols-1 lg:grid-cols-2 gap-3"></div>
    </main>

    <div id="form-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-emerald-50 rounded-t-2xl">
                <h2 id="form-title" class="text-lg font-bold text-emerald-950">Nouveau défi</h2>
                <button type="button" onclick="closeForm()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="challenge-form" class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="challenge-id">
                <div>
                    <label class="text-xs font-bold uppercase text-slate-500">Numéro</label>
                    <input id="field-number" type="number" min="1" required class="w-full border border-slate-300 rounded-xl px-4 py-2 mt-1">
                </div>
                <div>
                    <label class="text-xs font-bold uppercase text-slate-500">Titre</label>
                    <input id="field-title" type="text" required class="w-full border border-slate-300 rounded-xl px-4 py-2 mt-1">
                </div>
                <div>
                    <label class="text-xs font-bold uppercase text-slate-500">Objectif / Validation / Solution</label>
                    <textarea id="field-solution" rows="6" class="w-full border border-slate-300 rounded-xl px-4 py-2 mt-1"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeForm()" class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100">Annuler</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let challenges = [];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function loadChallenges() {
            const res = await fetch('api/challenges?all=1');
            challenges = await res.json();
            render();
        }

        function render() {
            const list = document.getElementById('challenges-list');
            const sorted = [...challenges].sort((a, b) => a.number - b.number);

            list.innerHTML = sorted.length
                ? sorted.map(c => `
                    <div class="bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between gap-4 ${c.active ? '' : 'opacity-50'}">
                        <div class="min-w-0">
                            <div class="font-bold text-emerald-950 truncate">Défi n°${c.number} - ${escapeHtml(c.title)}</div>
                            ${c.active ? '' : '<span class="text-xs text-rose-500 font-semibold">Désactivé</span>'}
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="openForm(${c.id})" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700">Éditer</button>
                            ${c.active
                                ? `<button onclick="toggleActive(${c.id}, false)" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600">Supprimer</button>`
                                : `<button onclick="toggleActive(${c.id}, true)" class="px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700">Réactiver</button>`
                            }
                        </div>
                    </div>
                `).join('')
                : `<p class="text-sm text-slate-400 italic">Aucun défi enregistré.</p>`;
        }

        function openForm(id) {
            const form = document.getElementById('challenge-form');
            form.reset();
            document.getElementById('challenge-id').value = '';

            if (id) {
                const c = challenges.find(ch => ch.id === id);
                document.getElementById('form-title').textContent = 'Éditer le défi';
                document.getElementById('challenge-id').value = c.id;
                document.getElementById('field-number').value = c.number;
                document.getElementById('field-title').value = c.title;
                document.getElementById('field-solution').value = c.solution || '';
            } else {
                document.getElementById('form-title').textContent = 'Nouveau défi';
                const maxNumber = challenges.reduce((max, c) => Math.max(max, c.number), 0);
                document.getElementById('field-number').value = maxNumber + 1;
            }

            document.getElementById('form-modal').classList.remove('hidden');
        }

        function closeForm() {
            document.getElementById('form-modal').classList.add('hidden');
        }

        document.getElementById('challenge-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('challenge-id').value;
            const existing = id ? challenges.find(ch => ch.id === Number(id)) : null;

            const payload = {
                number: Number(document.getElementById('field-number').value),
                title: document.getElementById('field-title').value.trim(),
                solution: document.getElementById('field-solution').value.trim(),
                active: existing ? !!existing.active : true
            };

            const res = await fetch(id ? `api/challenges/${id}` : 'api/challenges', {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                closeForm();
                loadChallenges();
            } else {
                alert("Impossible d'enregistrer ce défi, vérifiez les champs.");
            }
        });

        async function toggleActive(id, active) {
            const c = challenges.find(ch => ch.id === id);
            if (!c) return;

            if (!active) {
                if (!confirm(`Retirer "${c.title}" des prochaines sessions ?`)) return;
                const res = await fetch(`api/challenges/${id}`, { method: 'DELETE' });
                if (res.ok) loadChallenges();
                return;
            }

            const res = await fetch(`api/challenges/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number: c.number, title: c.title, solution: c.solution, active: true })
            });
            if (res.ok) loadChallenges();
        }

        loadChallenges();
    </script>
</body>
</html>
