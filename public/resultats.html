<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranch du Phoenix - Résultats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f1f5f2; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

    <header class="bg-emerald-950 border-b border-emerald-900 shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
            <span class="text-2xl">🌿</span>
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-white tracking-wide">Ranch du Phoenix</h1>
                <p class="text-xs text-emerald-300 font-medium tracking-wider uppercase">Résultats de la session</p>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-10">
        <div id="content" class="text-center text-slate-400 italic py-16">Chargement des résultats…</div>
    </main>

    <script>
        const SESSION_ID = location.pathname.split('/').filter(Boolean).pop();

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        function formatDuree(heures) {
            const totalMinutes = Math.round(heures * 60);
            const h = Math.floor(totalMinutes / 60);
            const m = totalMinutes % 60;
            return h > 0 ? `${h}h${String(m).padStart(2, '0')}` : `${m} min`;
        }

        async function load() {
            const content = document.getElementById('content');
            const res = await fetch(`api/sessions/${SESSION_ID}/resultats`);

            if (res.status === 409) {
                content.innerHTML = `
                    <p class="text-slate-500 mb-3">Cette session est encore en cours.</p>
                    <a href="session/${SESSION_ID}" class="text-emerald-700 font-semibold underline">Retour à la session</a>
                `;
                return;
            }
            if (!res.ok) {
                content.innerHTML = `<p class="text-rose-600">Session introuvable.</p>`;
                return;
            }

            const data = await res.json();

            const rankBlock = data.rank
                ? `
                    <div class="mt-6 bg-emerald-50 border border-emerald-100 rounded-2xl p-5">
                        <div class="text-xs uppercase tracking-wider text-emerald-700 font-bold mb-1">Positionnement</div>
                        <div class="text-2xl font-black text-emerald-900">${data.rank}<sup>e</sup> sur ${data.total_sessions} sessions</div>
                        <div class="text-sm text-emerald-700 mt-1">Top ${data.top_percent}% des sessions jouées</div>
                    </div>
                `
                : `
                    <div class="mt-6 bg-slate-100 border border-slate-200 rounded-2xl p-5 text-sm text-slate-500">
                        Première session enregistrée — pas encore de comparaison possible.
                    </div>
                `;

            content.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 text-left">
                    <div class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1">${escapeHtml(data.session_date)}</div>
                    <h2 class="text-xl font-bold text-emerald-950 mb-4">${escapeHtml(data.client_name)}</h2>
                    <div class="grid grid-cols-3 gap-3 text-center">
                        <div class="bg-slate-50 rounded-xl p-3">
                            <div class="text-xs text-slate-400 font-bold uppercase">Équipes</div>
                            <div class="text-lg font-extrabold text-slate-700">${data.nb_equipes}</div>
                        </div>
                        <div class="bg-slate-50 rounded-xl p-3">
                            <div class="text-xs text-slate-400 font-bold uppercase">Durée</div>
                            <div class="text-lg font-extrabold text-slate-700">${formatDuree(data.duree_heures)}</div>
                        </div>
                        <div class="bg-amber-50 rounded-xl p-3">
                            <div class="text-xs text-amber-600 font-bold uppercase">Score</div>
                            <div class="text-lg font-extrabold text-amber-700">${data.score_total} pts</div>
                        </div>
                    </div>
                </div>
                ${rankBlock}
                <p class="text-center mt-6">
                    <a href="classement" class="text-sm text-emerald-700 font-semibold underline">Voir le classement complet des sessions</a>
                </p>
            `;
        }

        load();
    </script>
</body>
</html>
