<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranch du Phoenix - Mon compte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f1f5f2; }
        .btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; font-size: 1.15rem; border: 1px solid #065f46; border-radius: 9999px; color: #a7f3d0; background: transparent; cursor: pointer; transition: background-color .15s; }
        .btn-icon:hover { background-color: rgba(6, 78, 59, .6); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

    <header class="bg-emerald-950 border-b border-emerald-900 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <a href="./" title="Retour à l'accueil" class="text-2xl hover:opacity-70 transition-opacity">🌿</a>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-white tracking-wide">Ranch du Phoenix</h1>
                    <p class="text-xs text-emerald-300 font-medium tracking-wider uppercase">Mon compte</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="./" title="Accueil" aria-label="Accueil" class="btn-icon">🏠</a>
                <button id="logout" type="button" title="Se déconnecter" aria-label="Se déconnecter" class="btn-icon">🚪</button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-10">
        <form id="form" class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-3">
            <h2 class="text-lg font-bold text-emerald-950">Changer le mot de passe</h2>
            <input id="current" type="password" required autocomplete="current-password" placeholder="Mot de passe actuel"
                class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <input id="next" type="password" required autocomplete="new-password" placeholder="Nouveau mot de passe (8 caractères minimum)"
                class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <input id="confirm" type="password" required autocomplete="new-password" placeholder="Confirmer le nouveau mot de passe"
                class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <p id="message" class="text-sm hidden"></p>
            <button type="submit" class="w-full px-6 py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl transition-colors">Enregistrer</button>
        </form>
    </main>

    <script>
        const message = document.getElementById('message');

        function show(text, ok) {
            message.textContent = text;
            message.className = 'text-sm ' + (ok ? 'text-emerald-700' : 'text-rose-600');
        }

        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const current = document.getElementById('current').value;
            const next = document.getElementById('next').value;
            if (next !== document.getElementById('confirm').value) {
                show('Les deux nouveaux mots de passe ne correspondent pas.', false);
                return;
            }
            const res = await fetch('api/auth/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ current, next })
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                e.target.reset();
                show('Mot de passe modifié.', true);
            } else {
                show(data.message || 'Une erreur est survenue, réessayez.', false);
            }
        });

        document.getElementById('logout').addEventListener('click', async () => {
            await fetch('api/auth/logout', { method: 'POST' });
            location.href = 'login';
        });
    </script>
</body>
</html>
