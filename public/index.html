<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranch du Phoenix - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f1f5f2; }
        .btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; font-size: 1.15rem; border: 1px solid #065f46; border-radius: 9999px; color: #a7f3d0; transition: background-color .15s; }
        .btn-icon:hover { background-color: rgba(6, 78, 59, .6); }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

    <header class="bg-emerald-950 border-b border-emerald-900 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🌿</span>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-white tracking-wide">Ranch du Phoenix</h1>
                    <p class="text-xs text-emerald-300 font-medium tracking-wider uppercase">Espace Team Building & Cohésion</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-wrap justify-end">
                <a href="classement" title="Classement" aria-label="Classement" class="btn-icon">🏆</a>
                <a href="defis" title="Gérer les défis" aria-label="Gérer les défis" class="btn-icon">🛠️</a>
                <a href="compte" title="Mon compte" aria-label="Mon compte" class="btn-icon">👤</a>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8 space-y-8">
        <section class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <h2 class="text-lg font-bold text-emerald-950 mb-4">Démarrer une nouvelle session</h2>
            <form id="new-session-form" class="flex flex-col sm:flex-row gap-3">
                <input id="client-name" type="text" placeholder="Nom du client teambuilding" required
                    class="flex-1 border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600">
                <input id="nb-equipes" type="number" min="1" step="1" placeholder="Nb équipes" required
                    class="w-full sm:w-36 border border-slate-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-600">
                <button type="submit" class="px-6 py-2.5 bg-emerald-800 hover:bg-emerald-900 text-white font-bold rounded-xl transition-colors">Démarrer</button>
            </form>
        </section>

        <section>
            <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Sessions en cours</h2>
            <div id="in-progress-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        </section>

        <section>
            <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Sessions archivées</h2>
            <div id="archived-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        </section>
    </main>

    <script>
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function loadSessions() {
            const res = await fetch('api/sessions');
            const sessions = await res.json();

            const inProgress = sessions.filter(s => s.status === 'in_progress');
            const archived = sessions.filter(s => s.status === 'archived');

            const inProgressList = document.getElementById('in-progress-list');
            inProgressList.innerHTML = inProgress.length
                ? inProgress.map(s => `
                    <a href="session/${s.id}" class="block bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow">
                        <div class="font-bold text-emerald-950">${escapeHtml(s.client_name)}</div>
                        <div class="text-xs text-slate-500">${s.nb_equipes} équipe(s) · démarrée le ${new Date(s.started_at).toLocaleString('fr-BE')}</div>
                    </a>
                `).join('')
                : `<p class="text-sm text-slate-400 italic">Aucune session en cours.</p>`;

            const archivedList = document.getElementById('archived-list');
            archivedList.innerHTML = archived.length
                ? archived.map(s => `
                    <a href="resultats/${s.id}" class="block bg-white p-4 rounded-xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow">
                        <div class="font-bold text-slate-700">${escapeHtml(s.client_name)}</div>
                        <div class="text-xs text-slate-500">${escapeHtml(s.session_date)} · ${s.nb_equipes} équipe(s)</div>
                    </a>
                `).join('')
                : `<p class="text-sm text-slate-400 italic">Aucune session archivée.</p>`;
        }

        document.getElementById('new-session-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const client_name = document.getElementById('client-name').value.trim();
            const nb_equipes = Number(document.getElementById('nb-equipes').value);

            const res = await fetch('api/sessions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_name, nb_equipes })
            });

            if (res.ok) {
                const session = await res.json();
                window.location.href = `session/${session.id}`;
            } else {
                alert("Impossible de démarrer la session, vérifiez les champs.");
            }
        });

        loadSessions();
    </script>
</body>
</html>
